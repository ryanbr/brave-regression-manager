# Manual, artefact-only build. No tag, no Release, no version bump.
#
# release.yml is the only thing that has ever compiled the macOS and
# ARM-Windows targets, and it only runs on a `v*` tag or a dispatch that
# mints a Release — so the sole way to type-check those platforms was to
# cut a version. A macOS build break duly reached master and survived
# four review passes, because `cfg(target_os = "macos")` code is
# invisible to a Linux or Windows compiler.
#
# This runs the same matrix, uploads the binaries as workflow artefacts,
# and publishes nothing.
name: Build check (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which target to build'
        type: choice
        default: all
        options:
          - all
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - aarch64-apple-darwin
      clippy:
        description: 'Also run clippy with warnings denied'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The matrix is built here rather than filtered with a job-level `if`:
  # the `matrix` context is not available in `jobs.<id>.if`, so such a
  # condition would silently never match. Selecting the targets up front
  # also means a single-target run spins up one runner, not four that
  # skip.
  plan:
    name: Pick targets
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        shell: bash
        env:
          WANT: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # Mirrors release.yml's matrix: the point is to compile exactly
          # what a release compiles, so a break here is a break there.
          all='[
            {"os":"ubuntu-22.04",   "target":"x86_64-unknown-linux-gnu"},
            {"os":"windows-latest", "target":"x86_64-pc-windows-msvc"},
            {"os":"windows-latest", "target":"aarch64-pc-windows-msvc"},
            {"os":"macos-14",       "target":"aarch64-apple-darwin"}
          ]'
          if [ "$WANT" = all ]; then
            include=$(jq -c . <<<"$all")
          else
            include=$(jq -c --arg t "$WANT" '[.[] | select(.target == $t)]' <<<"$all")
          fi
          if [ "$(jq -r 'length' <<<"$include")" -eq 0 ]; then
            echo "::error::no target matched '$WANT'"
            exit 1
          fi
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "building: $include"

  build:
    needs: plan
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      # rust-toolchain.toml pins the toolchain, and rustup treats a
      # pinned version as a DIFFERENT install from `stable` even when
      # they resolve to the same release — so the target std the action
      # above installs lands on `stable` while cargo runs under the pin,
      # and a cross-compile fails with "can't find crate for `core`".
      # Native targets never noticed, because host std ships with every
      # toolchain; only aarch64-pc-windows-msvc broke. `rustup target
      # add` here applies to the ACTIVE (pinned) toolchain.
      - name: Add target to the pinned toolchain
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-check-${{ matrix.target }}

      # eframe's glow backend + arboard's clipboard backends + rfd's
      # xdg-portal backend all need a few system libs on Linux.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libgtk-3-dev

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Unix binaries are tarred first. actions/upload-artifact documents
      # that it stores every file mode 644 ("Permission Loss"), so an
      # uploaded Mach-O or ELF comes back non-executable; release.yml
      # sidesteps this the same way. Windows .exe needs no such bit.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd "target/${{ matrix.target }}/release"
          tar czf "brave-regress-${{ matrix.target }}.tar.gz" brave-regress


      # For testing a change, not for distribution — so no .app bundle
      # and no Release upload. Note that the macOS artefact therefore
      # proves the target *compiles* but is not directly runnable:
      # macOS 14+ refuses to exec a bare CLI Mach-O even after clearing
      # quarantine, which is why release.yml wraps it in a .app
      # (release.yml:238-241). Windows and Linux artefacts run as-is.
      #
      # v5 to match release.yml rather than drifting a major behind.
      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: brave-regress-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/brave-regress.exe
            target/${{ matrix.target }}/release/brave-regress-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      # Last, and deliberately: -D warnings on cfg arms that have never
      # been linted is exactly the sort of thing that fails, and running
      # it before Upload would withhold the very ARM-Windows binary this
      # workflow exists to produce. A failure here still fails the job.
      - name: Clippy
        if: ${{ inputs.clippy }}
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: >-
          cargo clippy --release --locked --all-targets
          --target ${{ matrix.target }} -- -D warnings
